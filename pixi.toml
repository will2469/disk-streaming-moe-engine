[workspace]
name = "disk-streaming-moe-engine"
version = "0.1.0"
description = "MoE streaming inference engine (Mojo 1.0.0) — Qwen3.6-35B-A3B"
authors = ["will2469 <will.i.is.ega@gmail.com>"]
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Pin eksak Mojo 1.0.0 stable (K6). Nightly (1.1.0.dev) dilarang untuk engine.
mojo = "==1.0.0"
# Linker C untuk `mojo build`/`mojo run` (M0-W0): major dipin, build string bebas.
gcc = ">=13,<14"

[tasks]
check = "mojo --version"
fmt = "mojo format src tests"
build = "bash -c 'PATH=\"/usr/bin:$PATH\" mojo build -I src src/main.mojo -o dismoen'"
pre-commit = "uv run --with pre-commit pre-commit"
test-m0 = "mojo run -I src tests/test_safetensors.mojo"
test-compare = "cargo test --manifest-path tools/dismoen-tools/Cargo.toml"
test-m1-model = "mojo run -I src src/model.mojo"
test-m1-cli = "bash tests/integration/test_m1_head_cli.sh"
test-m1-compare = "bash tests/integration/test_m1_compare.sh"
test-m1 = { depends-on = ["build", "test-compare", "test-m1-model", "test-m1-cli", "test-m1-compare"] }
test-m2-cli = "bash tests/integration/test_m2_w4_layer_cli.sh"
test-m2-compare = "bash tests/integration/test_m2_w5_compare.sh"
bench-m2 = "uv run python tools/bench/bench_m2_real.py"
test-m2 = { depends-on = ["build", "test-compare", "test-m1-model", "test-m2-cli", "test-m2-compare"] }
test-m3-cli = "bash tests/integration/test_m3_w3_moe_cli.sh"
test-m3-compare = "bash tests/integration/test_m3_w4_compare.sh"
test-m3-integration = "cargo test --manifest-path tools/dismoen-tools/Cargo.toml --test integration_m3"
bench-m3 = "uv run python tools/bench/bench_m3_real.py"
test-m3 = { depends-on = ["build", "test-compare", "test-m3-cli", "test-m3-compare", "test-m3-integration"] }
test-m4-cli = "bash tests/integration/test_m4_w1_forward_cli.sh"
test-m4-unit = "mojo run -I src tests/unit/test_m4_forward_layer.mojo"
test-m4-w2 = "bash tests/integration/test_m4_w2_layer_loop.sh"
generate-m4-fixtures = "uv run python tools/fixtures/generate_m4.py"
test-m4-w3 = "bash tests/integration/test_m4_w3_oracle.sh"
test-m4-integration = "cargo test --manifest-path tools/dismoen-tools/Cargo.toml --test integration_m4"
test-m4-w4 = "bash tests/integration/test_m4_w4_verdict.sh"
test-m4 = "bash tests/integration/test_m4_real_qwen36.sh"
test-m4-full = "bash tests/integration/test_m4_full_forward.sh"
test-m5-w1 = "bash tests/integration/test_m5_w1_kv_state.sh"
test-m5-w2 = "bash tests/integration/test_m5_w2_decode_loop.sh"
test-m5-w3 = "bash tests/integration/test_m5_w3_decode_cli.sh"
generate-m5-fixtures = "uv run python tools/fixtures/generate_m5.py"
test-m5-w4 = "bash tests/integration/test_m5_w4_oracle.sh"
bench-bw-stream = "uv run --python .venv python tools/bench/bench_bw_stream.py"
bench-m5 = "uv run --python .venv python tools/bench/bench_m5_real.py"
test-m5-w5 = "bash tests/integration/test_m5_w5_perf.sh"
test-m5 = "bash tests/integration/test_m5_kv_decode.sh"
test-m6-w1 = "bash tests/integration/test_m6_w1_format.sh"
test-m6-w2 = "bash tests/integration/test_m6_w2_algorithm.sh"
test-m6-w3 = "bash tests/integration/test_m6_w3_quantize_cli.sh"
test-m6-w4 = "bash tests/integration/test_m6_w4_dequant.sh"
test-m6-w5 = "bash tests/integration/test_m6_w5_oracle_ppl.sh"
test-m6 = "bash tests/integration/test_m6_quantize.sh"
test-m6-real = "bash tests/integration/test_m6_real_qwen36.sh"
test-m7-w1 = "bash tests/integration/test_m7_w1_odirect.sh"
test-m7-w2 = "bash tests/integration/test_m7_w2_lru.sh"
generate-m7-fixtures = "python3 tools/fixtures/generate_m7_io_patterns.py"
test-m7-w3 = "bash tests/integration/test_m7_w3_fixture.sh"
test-m7-w4 = "bash tests/integration/test_m7_w4_config_error.sh"
test-m7-w5 = "bash tests/integration/test_m7_w5_perf_core.sh"
bench-m7 = "uv run --python .venv python tools/bench/bench_m7_real.py"
test-m7 = "bash tests/integration/test_m7_odirect_lru.sh"
test-m7-real = "bash tests/integration/test_m7_real_qwen36.sh"
test-m8-w1 = "bash tests/integration/test_m8_w1_naive_oracle.sh"
test-m8-w2 = "bash tests/integration/test_m8_w2_chunked.sh"
test-m8-w3 = "bash tests/integration/test_m8_w3_gdn_cli.sh"
test-m8-w4 = "bash tests/integration/test_m8_w4_stability.sh"
test-m8-w5 = "bash tests/integration/test_m8_w5_integration.sh"
test-m8-w6 = "bash tests/integration/test_m8_w6_gates.sh"
validate-m8 = "bash -c 'bash tests/integration/test_m8_w1_naive_oracle.sh && bash tests/integration/test_m8_w2_chunked.sh && bash tests/integration/test_m8_w3_gdn_cli.sh && bash tests/integration/test_m8_w4_stability.sh && bash tests/integration/test_m8_w5_integration.sh && bash tests/integration/test_m8_w6_gates.sh'"
test-m8 = "bash -c 'pixi run validate-m8'"
test-m8-real = "bash tests/integration/test_m8_real_qwen36.sh"
test-m9-w1 = "bash tests/integration/test_m9_w1_config_adapter.sh"
test-m9-w2 = "bash tests/integration/test_m9_w2_scheduler.sh"
test-m9-w3 = "bash tests/integration/test_m9_w3_loader.sh"
test-m9-w4 = "bash tests/integration/test_m9_w4_oracle.sh"
test-m9-w5 = "bash tests/integration/test_m9_w5_perf.sh"
test-m9-w6 = "bash tests/integration/test_m9_w6_gates.sh"
validate-m9 = "bash -c 'bash tests/integration/test_m9_w1_config_adapter.sh && bash tests/integration/test_m9_w2_scheduler.sh && bash tests/integration/test_m9_w3_loader.sh && bash tests/integration/test_m9_w4_oracle.sh && bash tests/integration/test_m9_w5_perf.sh && bash tests/integration/test_m9_w6_gates.sh'"
test-m9 = "bash -c 'pixi run validate-m9'"
test-m9-real = "bash tests/integration/test_m9_real_qwen36.sh"
test-m10-w1 = "bash tests/integration/test_m10_w1_rebrand.sh"
test-m10-w2 = "bash tests/integration/test_m10_w2_sanitization.sh"
test-m10-w3 = "bash tests/integration/test_m10_w3_lockfile.sh"
test-m10-w4a = "bash tests/integration/test_m10_w3_forward_decode.sh"
test-m10-w5 = "bash tests/integration/test_m10_w5_gates.sh"
validate-m10 = "bash -c 'bash tests/integration/test_m10_w1_rebrand.sh && bash tests/integration/test_m10_w2_sanitization.sh && bash tests/integration/test_m10_w3_lockfile.sh && bash tests/integration/test_m10_w3_forward_decode.sh && bash tests/integration/test_m10_w5_gates.sh'"
test-m10 = "bash -c 'pixi run validate-m10'"
test-m10-real = "bash tests/integration/test_m10_real_qwen36.sh"
test-m11-w1 = "bash tests/integration/test_m11_w1_workerpool.sh"
test-m11-w2a = "bash tests/integration/test_m11_w2a_staging.sh"
test-m11-w2b = "pixi run mojo run -I src tests/unit/test_m11_w2b_overlap.mojo"
test-m11-w2 = "bash tests/integration/test_m11_w2_async_io.sh"
test-m11-w3a = "bash tests/integration/test_m11_w3a_prober.sh"
test-m11-w3b = "bash tests/integration/test_m11_w3b_calibrate.sh"
test-m11-w4 = "bash tests/integration/test_m11_w4_tail.sh"
test-m11-w5 = "bash tests/integration/test_m11_w5_gates.sh"
validate-m11 = "bash -c 'bash tests/integration/test_m11_w1_workerpool.sh && bash tests/integration/test_m11_w2_async_io.sh && bash tests/integration/test_m11_w3a_prober.sh && bash tests/integration/test_m11_w3b_calibrate.sh && bash tests/integration/test_m11_w4_tail.sh && bash tests/integration/test_m11_w5_gates.sh'"
test-m11 = "bash -c 'pixi run validate-m11'"
test-m12-w1a = "bash tests/integration/test_m12_w1a_tokenizer.sh"
test-m12-w1b = "bash tests/integration/test_m12_w1b_renderer.sh"
test-m12-w2a = "bash tests/integration/test_m12_session_continuity.sh"
test-m12-w2b = "bash tests/integration/test_m12_repl_interactive.sh"
