[package]
name = "dismoen-tools"
version = "0.1.0"
edition = "2021"
default-run = "dismoen-tools"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[lib]
name = "dismoen_tools"
path = "src/lib.rs"

[[bin]]
name = "dismoen-tools"
path = "src/bin/dismoen-tools.rs"
